# Mutation testing (Stryker) on the pure shared modules. A single full run
# (command runner, one `node --test` per mutant) now takes ~106 minutes, so
# the scope is partitioned into three cost-balanced shards that run in
# parallel, each well under the job timeout. Too slow to gate every pull
# request, it runs on pushes to main, weekly and on demand.
name: mutation

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # every Monday morning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # let every shard report its score even if another one breaks
      fail-fast: false
      # The three shards are balanced by estimated mutant count (~800 each).
      # Together they must cover exactly the `mutate` array of
      # stryker.config.json — test/mutationshards.test.mjs enforces the exact
      # partition (no gap, no duplicate). Note: the `thresholds.break: 75`
      # gate now applies per shard instead of globally, which is slightly
      # stricter on a weak shard and slightly laxer globally — acceptable.
      matrix:
        include:
          - shard: core
            mutate: search.js,userzones.js,shapes.js,tour.js,tilegrid.js,coords.js,seed.js,vitals.js,userannotations.js
          - shard: world
            mutate: sharestate.js,userpaths.js,rarebiomes.js,tilecache.js,searchhistory.js,slime.js,keys.js,compare.js,levelload.js
          - shard: user
            mutate: seedsearch.js,usermarkers.js,relief.js,userpresets.js,export.js,favorites.js,gallery.js,errorreport.js,legend.js,maptools.js,markers.js,palette.js,presets.js,profile.js,portals.js,theme.js,composition.js
    name: mutation (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true   # the biome-name parity test reads cubiomes/util.c
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # --mutate on the CLI replaces the `mutate` array of the config file,
      # restricting this job to its shard.
      # stryker is a pinned devDependency installed with lifecycle scripts
      # disabled: no on-demand npx execution (S6505/S8543)
      - run: ./node_modules/.bin/stryker run --mutate "$MUTATE"
        env:
          MUTATE: ${{ matrix.mutate }}
