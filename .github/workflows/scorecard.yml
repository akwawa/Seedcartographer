# OpenSSF Scorecard: weekly (and on-push) measurement of the repository's
# supply-chain security posture, published to code scanning and to the
# public Scorecard API (for the README badge).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # publish_results signed attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          # Fine-grained PAT (Administration: read-only) pour le check
          # Branch-Protection ; fallback sur le GITHUB_TOKEN par défaut si
          # le secret SCORECARD_TOKEN n'est pas défini
          # (voir docs/BEST_PRACTICES.md).
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
